[package]
name = "rework-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rework MCP server over stdio (hand-rolled JSON-RPC, no MCP SDK dependency)"

[[bin]]
name = "rework-mcp"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync"] }
serde.workspace = true
serde_json.workspace = true
rework-core = { workspace = true }
